[package]
name = "bombini-detectors-ebpf"
version = "0.1.0"
edition = "2024"

[build-dependencies]
bindgen = "0.71"

[dependencies]
aya-ebpf = "0.1.1"
bombini-common = { path = "../bombini-common" }
kunai-macros = { path = "src/kunai-macros" }
bitflags = "2.11.0"
paste = "1.0"
cfg-if = "*"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[workspace]
members = []
